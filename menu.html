<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Menu - Brew Bakes & Coffee Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <button class="mobile-nav-toggle" aria-label="Toggle navigation">☰</button>
            <button class="back-btn" title="Go back" aria-label="Go back">←</button>
            <div class="logo">Brew Bakes & Coffee Shop</div>
            <nav>
                <ul>
                    <li style="display:inline-block"><a href="index.html">Home</a></li>
                    <li style="display:inline-block"><a href="menu.html">Menu</a></li>
                    <li style="display:inline-block"><a href="about.html">About</a></li>
                    <li style="display:inline-block"><a href="contact.html">Contact</a></li>
                    <li><a href="cart.html" class="cart-icon" style="display:inline-block">🛒 <span class="cart-count" id="cartCount">0</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="site-main container">
        <section>
            <h2 class="section-title">Our Menu</h2>
            <div class="menu-categories">
                <button class="category-btn active" data-category="all">All Items</button>
                <button class="category-btn" data-category="coffee">Coffee</button>
                <button class="category-btn" data-category="tea">Tea</button>
                <button class="category-btn" data-category="pastry">Pastries</button>
                <button class="category-btn" data-category="cake">Cakes</button>
                <button class="category-btn" data-category="brownie">Brownies</button>
            </div>
            <div class="menu-grid" id="menuGrid">
                <!-- Menu items will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div>© Brew Bakes & Coffee Shop</div>
            <div><a href="index.html">Home</a> · <a href="about.html">About</a> · <a href="contact.html">Contact</a></div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
